name: Desktop validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type, lint, test, and build
    runs-on: [self-hosted, windows]
    # A self-hosted runner executes workflow code on a personal machine, so pull requests from
    # forks of this public repository are not run here; same-repository branches and pushes are.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    # PowerShell 7 ships with a RemoteSigned policy; Windows PowerShell 5.1 blocks step scripts
    # on a fresh self-hosted machine until an execution policy is set.
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # resources/codex-schema is generated, not committed, and the ChatGPT adapter imports its
      # types, so typecheck cannot run without it. The pinned binary that generates it is
      # verified against the manifest digest by the fetch script itself.
      - name: Restore the pinned Codex sidecar
        uses: actions/cache@v4
        with:
          path: resources/sidecar
          key: codex-sidecar-${{ runner.os }}-${{ hashFiles('resources/runtime/codex-runtime-manifest.json') }}

      - name: Generate the app-server schema
        run: npm run sidecar:fetch

      - name: Check types
        run: npm run typecheck

      - name: Check lint and design tokens
        run: npm run lint

      - name: Run unit and integration tests
        run: npm test

      - name: Validate generated assets
        run: npm run assets:validate

      - name: Build desktop application
        run: npm run build
