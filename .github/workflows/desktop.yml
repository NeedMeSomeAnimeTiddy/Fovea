name: Desktop validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type, lint, test, and build
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # resources/codex-schema is generated, not committed, and the ChatGPT adapter imports its
      # types, so typecheck cannot run without it. The pinned binary that generates it is
      # verified against the manifest digest by the fetch script itself.
      - name: Restore the pinned Codex sidecar
        uses: actions/cache@v4
        with:
          path: resources/sidecar
          key: codex-sidecar-${{ runner.os }}-${{ hashFiles('resources/runtime/codex-runtime-manifest.json') }}

      - name: Generate the app-server schema
        run: npm run sidecar:fetch

      - name: Check types
        run: npm run typecheck

      - name: Check lint and design tokens
        run: npm run lint

      - name: Run unit and integration tests
        run: npm test

      - name: Validate generated assets
        run: npm run assets:validate

      - name: Build desktop application
        run: npm run build
