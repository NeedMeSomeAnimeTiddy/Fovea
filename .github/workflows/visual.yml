name: Visual regression

on:
  pull_request:
    paths:
      - '.github/workflows/visual.yml'
      - 'docs/visual-qa.md'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.visual.config.ts'
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'tests/visual/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual.yml'
      - 'docs/visual-qa.md'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.visual.config.ts'
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'tests/visual/**'
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Regenerate baselines on the runner and push them to a visual-baselines/run-<id> branch for review
        required: false
        default: false
        type: boolean

# The compare job pushes baseline candidates to a review branch when dispatched with
# update_baselines, which needs write access. It never writes on pull_request or push runs.
permissions:
  contents: write

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Chromium renderer baselines
    runs-on: [self-hosted, windows]
    # A self-hosted runner executes workflow code on a personal machine, so pull requests from
    # forks of this public repository are not run here; same-repository branches and pushes are.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Compare approved baselines
        env:
          # Set for the whole step so every Playwright worker inherits it. A worker cannot see the
          # --update-snapshots flag, and without this it would skip the screenshots and write none.
          FOVEA_VISUAL_UPDATE_BASELINES: ${{ inputs.update_baselines }}
        run: |
          if ('${{ inputs.update_baselines }}' -eq 'true') {
            npx playwright test --config playwright.visual.config.ts --update-snapshots
          } else {
            npx playwright test --config playwright.visual.config.ts
          }

      # The upload's if-no-files-found guard cannot catch an empty generation, because the
      # directory always holds its README. Count the images instead.
      - name: Verify baseline candidates were written
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        run: |
          $root = 'tests/visual/__snapshots__'
          $count = 0
          if (Test-Path $root) {
            $count = (Get-ChildItem -Path $root -Recurse -Filter *.png -File).Count
          }
          if ($count -eq 0) {
            throw 'Baseline generation wrote no PNG files, so the artifact would contain nothing to review.'
          }
          Write-Host "Wrote $count baseline candidates."

      # Candidates travel as a branch rather than an artifact: artifacts count against the account's
      # storage quota and were unavailable when this was written, and a branch is easier to review.
      - name: Push baseline candidates to a review branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $branch = "visual-baselines/run-${{ github.run_id }}"
          git add tests/visual/__snapshots__
          if (-not (git status --porcelain -- tests/visual/__snapshots__)) {
            Write-Host 'Every regenerated baseline matched the committed one; nothing to push.'
            exit 0
          }
          git checkout -b $branch
          git commit -m "Regenerate visual baselines on the CI runner (run ${{ github.run_id }})"
          git push origin $branch
          Write-Host "Pushed $branch for review."

      - name: Upload visual failure evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/visual
            playwright-report/visual

      - name: Upload baseline candidates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-candidates-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: tests/visual/__snapshots__
