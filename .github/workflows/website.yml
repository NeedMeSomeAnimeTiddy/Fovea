name: Website validation

on:
  pull_request:
    paths:
      - '.github/workflows/website.yml'
      - 'website/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/website.yml'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, build, and test
    runs-on: [self-hosted, windows]
    # A self-hosted runner executes workflow code on a personal machine, so pull requests from
    # forks of this public repository are not run here; same-repository branches and pushes are.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check lint
        run: npm run lint

      - name: Build the worker and check the rendered page
        run: npm test
