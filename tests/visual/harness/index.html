<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fovea visual fixture</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        position: relative;
        overflow: hidden;
      }

      #visual-backdrop {
        position: fixed;
        inset: 0;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.08)),
          repeating-conic-gradient(#6a7282 0 25%, #555d6c 0 50%) 0 / 24px 24px;
        pointer-events: none;
      }

      #root {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="visual-backdrop" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
